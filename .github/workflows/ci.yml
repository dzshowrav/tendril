name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Monorepo Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint Android Shell
        run: npm run lint:shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build web UI & CLI bundle
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run E2E & budget checks
        run: npm run e2e

      - name: Test doctor command
        run: node dist/tendril.mjs doctor

      - name: Test version command
        run: node dist/tendril.mjs --version

  android:
    name: Android Shell APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Android Shell Lint
        run: node scripts/lint-shell.mjs

      - name: Build APKs with Gradle
        run: |
          cd apps/android-shell
          chmod +x gradlew
          ./gradlew lint assembleRelease assembleDebug

      - name: Sign & Package Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "Generating release signing keypair..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias tendril \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tendril123 \
              -keypass tendril123 \
              -dname "CN=Tendril, OU=Development, O=Tendril, L=Android, S=Termux, C=US"
            STORE_PASS="tendril123"
            ALIAS="tendril"
            KEY_PASS="tendril123"
          fi

          RELEASE_UNSIGNED="apps/android-shell/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RELEASE_UNSIGNED" ]; then
            RELEASE_UNSIGNED="apps/android-shell/app/build/outputs/apk/release/app-release.apk"
          fi

          echo "Signing release APK with apksigner..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$STORE_PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --out tendril-shell-release.apk \
            "$RELEASE_UNSIGNED"

          echo "Verifying signed APK..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs tendril-shell-release.apk

          cp apps/android-shell/app/build/outputs/apk/debug/app-debug.apk tendril-shell-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tendril-shell-release
          path: tendril-shell-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tendril-shell-debug
          path: tendril-shell-debug.apk
