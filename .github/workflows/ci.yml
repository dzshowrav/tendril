name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Monorepo Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Lint Android Shell
        run: npm run lint:shell

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build web UI & CLI bundle
        run: npm run build

      - name: Test doctor command
        run: node dist/tendril.mjs doctor

      - name: Test version command
        run: node dist/tendril.mjs --version

  android:
    name: Android Shell APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run Android Shell Lint
        run: node scripts/lint-shell.mjs

      - name: Build Debug APK with Gradle
        run: |
          cd apps/android-shell
          chmod +x gradlew
          ./gradlew lint assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tendril-shell-debug
          path: apps/android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
