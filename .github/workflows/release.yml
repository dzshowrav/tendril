name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write
  id-token: write

jobs:
  release-npm:
    name: Build, Verify & Publish npm Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Lint Shell & Web Security
        run: npm run lint:shell

      - name: Typecheck
        run: npm run typecheck

      - name: Build Web UI & CLI bundle
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Hardening & Performance Budgets
        run: npm run e2e

      - name: Verify zero runtime dependencies in dist
        run: |
          cd dist
          npm ls --omit=dev

      - name: Smoke test CLI
        run: |
          node dist/tendril.mjs doctor
          node dist/tendril.mjs --version

      - name: Tarball dist
        run: |
          tar -czvf tendril-dist.tar.gz -C dist .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-tarball
          path: tendril-dist.tar.gz

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing to npm with provenance..."
            cd dist
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN not set; skipping npm publish."
          fi

  release-apk:
    name: Build & Sign Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: |
          cd apps/android-shell
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Package & Sign APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          cp apps/android-shell/app/build/outputs/apk/debug/app-debug.apk release-artifacts/tendril-shell-debug.apk

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "Release keystore secrets not provided. Generating dedicated release signing key..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias tendril \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass tendril123 \
              -keypass tendril123 \
              -dname "CN=Tendril, OU=Release, O=Tendril, L=Android, S=Termux, C=US"
            STORE_PASS="tendril123"
            ALIAS="tendril"
            KEY_PASS="tendril123"
          fi

          RELEASE_UNSIGNED="apps/android-shell/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RELEASE_UNSIGNED" ]; then
            RELEASE_UNSIGNED="apps/android-shell/app/build/outputs/apk/release/app-release.apk"
          fi

          echo "Signing release APK with apksigner..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:"$STORE_PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --out release-artifacts/tendril-shell-release.apk \
            "$RELEASE_UNSIGNED"

          echo "Verifying signed release APK..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs release-artifacts/tendril-shell-release.apk

          FINGERPRINT=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release-artifacts/tendril-shell-release.apk | grep "SHA-256 digest" | head -n 1 | awk '{print $3}')
          echo "FINGERPRINT=$FINGERPRINT" >> $GITHUB_ENV
          rm -f release.keystore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifacts
          path: release-artifacts/

  create-github-release:
    name: Create GitHub Release
    needs: [release-npm, release-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-tarball
          path: release-assets

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-artifacts
          path: release-assets

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name != '' && github.ref_name || inputs.tag }}
        run: |
          TARGET_TAG="${TAG_NAME:-v0.1.0}"
          RELEASE_TITLE="Tendril ${TARGET_TAG}"
          NOTES="## Tendril ${TARGET_TAG} 🚀
          
          ### Artifacts:
          - **tendril-shell-debug.apk**: Android companion WebView app (Debug build).
          - **tendril-shell-release.apk**: Android companion WebView app (Release build).
          - **tendril-dist.tar.gz**: Standalone executable CLI & Web bundle.
          - **SHA256SUMS**: Checksums for all released binaries.
          
          ### Installation in Termux:
          \`\`\`bash
          curl -sL https://raw.githubusercontent.com/dzshowrav/tendril/main/scripts/install.sh | bash
          # or: npm install -g tendril
          \`\`\`
          
          ### Verification:
          Inspect SHA256SUMS before installing on device."
          
          gh release create "$TARGET_TAG" \
            release-assets/* \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --draft=false \
            --prerelease=false || echo "Release already exists or draft updated."
